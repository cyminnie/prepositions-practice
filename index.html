<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文文法練習 — 介詞 & 時態</title>
<style>
  :root { --green:#1a7f37; --green-bg:#d9f3e1; --red:#c62828; --red-bg:#ffe3e3; --accent:#4f6ef7; --line:#e3e8f0; }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft JhengHei", sans-serif;
    background: #f4f6fb; color: #1f2430;
  }
  .sidebar {
    position: fixed; left: 0; top: 0; bottom: 0; width: 216px;
    background: #1f2430; color: #fff; padding: 20px 14px; overflow-y: auto; z-index: 10;
  }
  .sidebar .brand { font-size: 16px; font-weight: 700; margin: 0 0 4px; }
  .sidebar .brand-sub { font-size: 11px; color: #9aa3b2; margin-bottom: 18px; }
  .sidebar button.tab {
    display: block; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px;
    border: none; border-radius: 10px; background: transparent; color: #c7cdd8;
    font-size: 15px; cursor: pointer; transition: background .15s, color .15s;
  }
  .sidebar button.tab:hover { background: #2b3140; color: #fff; }
  .sidebar button.tab.active { background: var(--accent); color: #fff; font-weight: 600; }
  .sidebar .tab-note { font-size: 11px; color: #9aa3b2; display: block; margin-top: 2px; font-weight: normal; }
  .main { margin-left: 216px; padding: 24px 28px 90px; max-width: 940px; }
  .subject { display: none; }
  .subject.active { display: block; }
  .subject-head {
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px;
    box-shadow: 0 2px 10px rgba(20,30,60,.05); position: sticky; top: 12px; z-index: 5;
  }
  .subject-head h1 { margin: 0 0 6px; font-size: 21px; }
  .subject-head .sub { color: #6b7280; font-size: 13px; margin-bottom: 10px; }
  .scorebar { font-size: 14px; display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 10px; }
  .scorebar b { color: var(--green); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button.action {
    border: 1px solid #cfd6e4; background: #fff; border-radius: 8px; padding: 6px 13px;
    font-size: 13px; cursor: pointer; color: #334;
  }
  button.action:hover { background: #f0f3ff; border-color: var(--accent); }
  a.action {
    display: inline-block; text-decoration: none; border: 1px solid #cfd6e4; background: #fff;
    border-radius: 8px; padding: 9px 16px; font-size: 14px; cursor: pointer; color: #334;
  }
  a.action:hover { background: #f0f3ff; border-color: var(--accent); }
  .download-bar { margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .download-bar .dl-note { font-size: 12.5px; color: #6b7280; }
  /* vocab */
  .wrow { display: flex; align-items: baseline; gap: 8px; padding: 6px 2px; border-bottom: 1px solid #f0f2f6; flex-wrap: wrap; }
  .wrow .w { font-weight: 600; font-size: 16px; min-width: 96px; color: #1f2430; }
  .wrow .pos { color: #8a93a6; font-size: 12px; min-width: 40px; }
  .wrow .c { color: #333; min-width: 78px; }
  .wrow .ex { color: #6b7280; font-size: 13.5px; flex: 1 1 220px; }
  .speak-btn { border: none; background: transparent; cursor: pointer; font-size: 15px; padding: 0 2px; }
  .speak-btn:hover { transform: scale(1.15); }
  .quiz { margin-top: 10px; background: #f8fafc; border: 1px solid #e6ecf4; border-radius: 10px; padding: 12px 14px; }
  .quiz-q { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
  .quiz-q .zh { font-weight: 600; min-width: 90px; }
  .quiz-q input { width: 160px; font: inherit; font-size: 14px; padding: 3px 8px; border-radius: 7px; border: 1.5px solid #c8d0dd; outline: none; }
  .quiz-q input.correct { border-color: var(--green); background: var(--green-bg); }
  .quiz-q input.wrong { border-color: var(--red); background: var(--red-bg); }
  /* listening */
  .listen-unit { border-top: 1px solid #eef1f6; padding-top: 6px; }
  .lu-q { margin: 10px 0 4px; font-size: 15px; }
  .lu-q .lbl { font-weight: 600; color: #3b4fbf; margin-right: 6px; }
  .drill { background: #f8fafc; border: 1px solid #e6ecf4; border-radius: 10px; padding: 12px 14px; margin-top: 10px; }
  .drill .drill-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .transcript-toggle { cursor: pointer; color: #3b4fbf; font-size: 13px; background: none; border: none; padding: 0; }
  .transcript { display: none; margin-top: 8px; padding: 10px 12px; background: #f8fafc; border: 1px solid #e6ecf4; border-radius: 8px; font-size: 14px; line-height: 1.8; color: #444; }
  .transcript.open { display: block; }
  .jump { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
  .jump a {
    font-size: 12px; color: #3b4fbf; text-decoration: none; background: #eef2ff;
    padding: 3px 10px; border-radius: 999px;
  }
  .jump a:hover { background: #dce4ff; }
  section.ex {
    background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px;
    margin-top: 18px; box-shadow: 0 2px 10px rgba(20,30,60,.04);
  }
  section.ex h2 { margin: 0 0 2px; font-size: 17px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  section.ex .tag { font-size: 12px; color: #6b7280; font-weight: normal; }
  section.ex .instr { color: #6b7280; font-size: 13px; margin: 4px 0 12px; }
  ol { margin: 12px 0 0; padding-left: 24px; }
  li { font-size: 16.5px; line-height: 2.1; margin-bottom: 10px; }
  .check-row { margin: 10px 0 0; }
  /* choice blanks */
  .bk {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px; flex-wrap: wrap;
    min-width: 52px; padding: 1px 8px; margin: 0 2px;
    background: #f0f2f7; border: 1px dashed #b6bfce; border-radius: 6px;
    color: #8a93a6; cursor: pointer; user-select: none; vertical-align: middle;
    transition: background .12s, border-color .12s;
  }
  .bk:hover { background: #e8ecf6; border-color: var(--accent); color: #4a5a9c; }
  .bk.open { background: #eef2ff; border-color: var(--accent); border-style: solid; }
  button.choice {
    font: inherit; font-size: 15px; padding: 0 9px; border-radius: 6px; cursor: pointer;
    border: 1px solid #cfd6e4; background: #fff; color: #334;
  }
  button.choice:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  /* type-in blanks */
  .iw { display: inline-flex; align-items: center; gap: 5px; flex-wrap: wrap; vertical-align: middle; }
  input.ans {
    width: 150px; font: inherit; font-size: 15px; padding: 3px 8px; border-radius: 7px;
    border: 1.5px solid #c8d0dd; background: #fff; color: #1f2430; outline: none;
  }
  input.ans:focus { border-color: var(--accent); }
  input.ans.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); font-weight: 600; }
  input.ans.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }
  input.ans.revealed { border-color: #b0b7c3; background: #eef1f6; color: #334; }
  .base-hint { color: #8a93a6; font-size: 13.5px; margin-left: 2px; }
  .fill.correct { color: var(--green); background: var(--green-bg); padding: 0 9px; border-radius: 6px; font-weight: 600; }
  .fill.wrong { color: var(--red); background: var(--red-bg); padding: 0 9px; border-radius: 6px; font-weight: 600; }
  .hint { color: var(--green); font-weight: 700; }
  .hint-zh { color: #6b7280; font-size: 14px; }
  .fb { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14.5px; }
  .fb .badge { font-weight: 700; }
  .badge.ok { color: var(--green); }
  .badge.no { color: var(--red); }
  /* MC */
  .mc-q { font-size: 16.5px; margin-bottom: 8px; }
  .mc-opts { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 8px; }
  button.mcopt {
    text-align: left; font: inherit; font-size: 15px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
    border: 1.5px solid #d5dbe6; background: #fff; color: #334;
  }
  button.mcopt:hover { border-color: var(--accent); background: #f5f7ff; }
  button.mcopt.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); font-weight: 600; }
  button.mcopt.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }
  button.mcopt:disabled { cursor: default; }
  /* recap card */
  button.recap-toggle {
    border: none; background: #fff7e6; color: #b7791f; font-size: 12.5px; padding: 2px 9px;
    border-radius: 999px; cursor: pointer; border: 1px solid #ffe0a8;
  }
  button.recap-toggle:hover { background: #ffefd1; }
  .recap {
    display: none; margin: 8px 0 4px; padding: 12px 14px; background: #fffbef;
    border: 1px solid #f3e2bd; border-radius: 10px; font-size: 14px; line-height: 1.8; color: #5a4a20;
  }
  .recap.open { display: block; }
  .recap b { color: #8a5a00; }
  footer { text-align: center; color: #9aa3b2; font-size: 12px; margin-top: 26px; }
  @media (max-width: 820px) {
    .sidebar { position: static; width: 100%; display: flex; gap: 8px; align-items: center; padding: 12px; flex-wrap: wrap; }
    .sidebar .brand { margin: 0; }
    .sidebar .brand-sub { display: none; }
    .sidebar button.tab { width: auto; flex: 1; margin: 0; padding: 9px 10px; font-size: 14px; }
    .sidebar .tab-note { display: none; }
    .main { margin-left: 0; padding: 16px 12px 70px; }
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <p class="brand">Grammar Practice</p>
    <p class="brand-sub">介詞 · 時態 · 詞彙 · 聆聽</p>
    <button class="tab" data-subject="prepositions">介詞 <span class="tab-note">Prepositions · 5 份</span></button>
    <button class="tab" data-subject="tenses">時態 <span class="tab-note">Tenses · 10 份</span></button>
    <button class="tab" data-subject="vocab">詞彙 <span class="tab-note">Vocabulary · 高頻字</span></button>
    <button class="tab" data-subject="listening">聆聽 <span class="tab-note">Listening · A1</span></button>
  </aside>

  <div class="main" id="main"></div>

<script src="vocab-data.js"></script>
<script src="listening-data.js"></script>
<script>

/* ===================== RECAPS（知識點 recap 字典） ===================== */
const RECAPS = {
  /* ---- Tenses ---- */
  t_simple_present: { title: "簡單現在式 Simple Present", body:
    "用在：<b>① 習慣／恆真的事實</b>（Water boils at 100°C. 水在 100 度沸騰）<br>" +
    "<b>② 固定的時間表、行程</b>（The train leaves at 6:45. 火車 6:45 開出）<br>" +
    "<b>③ 狀態動詞</b>（know 知道、own 擁有、want 想要、like 喜歡、understand 明白）。<br>" +
    "形式：主語是 he / she / it 時，動詞要加 <b>-s</b>。" },
  t_state_verbs: { title: "狀態動詞 State Verbs", body:
    "表示「狀態」的動詞（know, own, want, like, believe, understand, love, need）通常<b>用簡單式，不用進行式</b>。<br>" +
    "✗ I am knowing → ✓ I know.　✗ She is owning → ✓ She owns." },
  t_present_continuous: { title: "現在進行式 Present Continuous", body:
    "用在：<b>① 正在發生</b>（Look! It is raining.）<b>② 暫時的情況</b><br>" +
    "<b>③ 已安排好的未來計劃</b>（We are having a party next Saturday.）<b>④ 抱怨</b>（He is always complaining.）<br>" +
    "形式：<b>am / is / are + V-ing</b>。" },
  t_present_perfect: { title: "現在完成式 Present Perfect", body:
    "用在：<b>① 過去開始、到現在仍持續</b>（用 for / since：I have lived here since 2018.）<br>" +
    "<b>② 剛剛完成</b>（just / already）<b>③ 過去動作影響現在</b>（He has lost his keys, so he can't open the door.）<br>" +
    "<b>④ 經驗</b>（ever / never / yet）<br>形式：<b>have / has + 過去分詞(past participle)</b>。" },
  t_present_perfect_cont: { title: "現在完成進行式 Present Perfect Continuous", body:
    "強調「動作<b>一直持續到現在、還沒停</b>」。<br>" +
    "I have been waiting for an hour.（我已經等了一小時，<b>還在等</b>）<br>" +
    "形式：<b>have / has been + V-ing</b>。常配 for / since / all day / lately。" },
  t_simple_past: { title: "簡單過去式 Simple Past", body:
    "用在「<b>已結束、有明確過去時間</b>」的動作（yesterday、last week、two days ago）。<br>" +
    "<b>過去的習慣</b>也用簡單過去式（When I was young, I walked to school.）<br>" +
    "形式：<b>V-ed</b>（不規則動詞要背）" },
  t_past_continuous: { title: "過去進行式 Past Continuous", body:
    "用在：<b>① 過去某時刻正在進行</b>（At 3 p.m., he was running.）<br>" +
    "<b>② 長動作被短動作打斷</b>（I was taking a shower <b>when</b> the phone rang.）<br>" +
    "<b>③ 兩個動作同時進行</b>（<b>While</b> Mum was cooking, I was watching TV.）<br>" +
    "形式：<b>was / were + V-ing</b>。" },
  t_past_perfect: { title: "過去完成式 Past Perfect", body:
    "用在「兩個過去動作中，<b>較早發生</b>」的那一個。<br>" +
    "By the time I arrived, the train <b>had left</b>.（火車<b>先</b>開走）<br>" +
    "形式：<b>had + 過去分詞</b>。常配 by the time / when / before / after / already。" },
  t_past_perfect_cont: { title: "過去完成進行式 Past Perfect Continuous", body:
    "強調「某動作<b>一直進行到另一個過去時間</b>」。<br>" +
    "We <b>had been queuing</b> for an hour before the counter opened.（排了一個小時，櫃台才開）<br>" +
    "形式：<b>had been + V-ing</b>。" },
  t_will: { title: "will + 原形（簡單未來式）", body:
    "用在：<b>① 當下臨時決定</b>（I will help you.）<b>② 猜測／預測</b>（I'm sure it will snow.）<b>③ 承諾／拒絕</b><br>" +
    "注意：副詞 <b>probably</b> 要放在 will 後面（will probably）。<br>形式：<b>will + 原形動詞</b>。" },
  t_going_to: { title: "be going to", body:
    "用在：<b>① 有「證據」的預測</b>（Look at the clouds! It is going to rain.）<br>" +
    "<b>② 早就打算好的計劃</b>（I am going to eat more healthily.）<br>" +
    "形式：<b>am / is / are + going to + 原形動詞</b>。" },
  t_present_future: { title: "用現在式表示未來", body:
    "<b>簡單現在式</b>：用在時刻表、正式安排（The train leaves at 6 a.m.）<br>" +
    "<b>現在進行式</b>：用在<b>個人已安排好的未來計劃</b>（I am leaving at 5 p.m.）" },
  t_future_continuous: { title: "未來進行式 Future Continuous", body:
    "表示「未來某個時間點<b>正在進行</b>」的動作。<br>" +
    "This time tomorrow, I <b>will be flying</b> to London.<br>形式：<b>will be + V-ing</b>。" },
  t_future_perfect: { title: "未來完成式 Future Perfect", body:
    "表示「到未來某時間點<b>已經完成</b>」的動作。<br>" +
    "By next year, I <b>will have finished</b> the project.<br>形式：<b>will have + 過去分詞</b>。常配 <b>by + 時間</b>。" },
  t_future_perfect_cont: { title: "未來完成進行式 Future Perfect Continuous", body:
    "強調「到未來某時間點，動作<b>已經持續了多久</b>」。<br>" +
    "By 2026, I <b>will have been working</b> here for ten years.<br>形式：<b>will have been + V-ing</b>。" },

  /* ---- Prepositions ---- */
  p_at_time: { title: "at + 時間點", body:
    "<b>at</b> 用在「具體的時間點」：at 7:30、at noon（中午）、at midnight、at the moment（此刻）、at present（目前）。<br>" +
    "也用在固定搭配：<b>at once</b>（立刻）、<b>at least</b>（至少）。" },
  p_in_time: { title: "in + 較長的時間段", body:
    "<b>in</b> 用在「一段時間、時段」：in the morning / afternoon / evening、in May、in 2020、in a moment（一會兒）、in the end（最後）。<br>" +
    "也用在 <b>in future</b>（將來）。" },
  p_on_time: { title: "on + 特定日子／日期", body:
    "<b>on</b> 用在「某一天、特定日期或晚上」：on Monday、on May 5、on the night of…<br>" +
    "也用在固定搭配：<b>on time</b>（準時）、<b>on end</b>（連續地）。" },
  p_at_place: { title: "at + 地點（點／目的地）", body:
    "<b>at</b> 用在「較小的地點、具體位置、目的地」：arrive at（到達）、look at（看）、at school、at the sight of（一看到）。" },
  p_in_place: { title: "in + 空間／地區／城市", body:
    "<b>in</b> 用在「較大的範圍、場所內部、城市、國家、區域」：in the supermarket、in New York、in the New Territories、in a building。" },
  p_on_place: { title: "on + 表面／樓層／交通工具", body:
    "<b>on</b> 用在「表面、樓層、交通工具上」：on the top floor（頂樓）、on board（在船上／機上）、on the bus（在巴士上）。<br>" +
    "也用在 <b>on a diet</b>（節食）。" },
  p_phrase: { title: "固定搭配（介詞片語）", body:
    "有些介詞是「<b>固定搭配</b>」，要整組記住：at once（立刻）、on time（準時）、at least（至少）、in a hurry（匆忙）、in surprise（吃驚）、in my opinion（依我看）、on average（平均）、in order to（為了）、in the examination（在考試中）。" },
  p_to: { title: "to 的用法", body:
    "<b>to</b> 表示：<b>① 方向／目的地</b>（go to、the way to、lead to、point to）<br>" +
    "<b>② 結果／程度</b>（moved to tears 感動落淚、to pieces 成碎片、to sleep 入睡）<br>" +
    "<b>③ 搭配動詞</b>（object to 反對、reply to 回覆、belong to 屬於、faithful to 忠於、answer to）。" },
  p_for: { title: "for 的用法", body:
    "<b>for</b> 表示：<b>① 目的／用途</b>（fight for、take medicine for、for treatment、for pleasure、for fun）<br>" +
    "<b>② 給某人</b>（a card for his mother、presents for the children）<br>" +
    "<b>③ 持續時間</b>（for two weeks、for ten years）<b>④ 價格</b>（bought for ten dollars）<b>⑤</b> for nothing（免費）。" },
  p_from: { title: "from 的用法", body:
    "<b>from</b> 表示：<b>① 來源／起點</b>（made from、take money from、borrow from）<br>" +
    "<b>② 分開／距離</b>（far from、away from、separated from、hide from）<br>" +
    "<b>③ 防止</b>（protect from）<b>④ 從一個到另一個</b>（from … to …）。" },
  p_against: { title: "against 的用法", body:
    "<b>against</b> 表示：<b>① 靠著</b>（lean against）<b>② 反對／違反</b>（against the law、against her will）<br>" +
    "<b>③ 逆著</b>（against the current 逆流）<b>④ 對…不利</b>（her age is against her）。" },
  p_by: { title: "by 的用法", body:
    "<b>by</b> 表示：<b>① 在…之前／到…為止</b>（by noon、by tomorrow、by then、by the time）<br>" +
    "<b>② 方式</b>（by air 搭飛機、by the dozen 按打計）<b>③ 相差</b>（miss by a few centimetres）<br>" +
    "<b>④ 乘以</b>（three by six）<b>⑤</b> day by day（一天一天地）。" },

/* ===================== 引擎 ===================== */
function norm(s) { return String(s).toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/\s+/g, ' ').trim(); }
function display(word, cap) { return cap ? word.charAt(0).toUpperCase() + word.slice(1) : word; }

function parseMarkup(s) {
  const tokens = [];
  const re = /\[([^\]]+)\]/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) tokens.push({ t: s.slice(last, m.index) });
    const parts = m[1].split('|');
    const ans = parts[0].split('/').map(x => norm(x));
    let base = null, zh = '', recap = '';
    if (parts.length >= 4) { base = parts[1]; zh = parts[2] || ''; recap = parts[3] || ''; }
    else { zh = parts[1] || ''; recap = parts[2] || ''; }
    tokens.push({ blank: true, answers: ans, primary: parts[0].split('/')[0].trim(), base, zh, recap, cap: m.index === 0 });
    last = m.index + m[0].length;
  }
  if (last < s.length) tokens.push({ t: s.slice(last) });
  return tokens;
}

function recapBlock(key) {
  const r = RECAPS[key];
  if (!r) return '';
  return '<button class="recap-toggle" type="button">📖 知識點 recap</button>' +
         '<div class="recap"><b>' + r.title + '</b><br>' + r.body + '</div>';
}

function attachRecap(host) {
  host.querySelectorAll('.recap-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const c = btn.nextElementSibling;
      if (c && c.classList.contains('recap')) { c.classList.toggle('open'); btn.textContent = c.classList.contains('open') ? '收起 recap' : '📖 知識點 recap'; }
    });
  });
}

/* ---------- 每個 subject 的狀態 ---------- */
function makeSubjectState(subject) {
  return { subject, correct: 0, answered: 0, total: 0, answerables: [] };
}

function updateScore(st) {
  const el = document.getElementById('score-' + st.subject.key);
  if (el) {
    el.textContent = st.correct;
    document.getElementById('answered-' + st.subject.key).textContent = st.answered;
    document.getElementById('total-' + st.subject.key).textContent = st.total;
  }
}

/* ---------- choice blank ---------- */
function renderChoiceBlank(tok, exChoices, st) {
  const btn = document.createElement('span');
  btn.className = 'bk';
  btn.dataset.answers = tok.answers.join('/');
  btn.dataset.primary = tok.primary;
  btn.dataset.cap = tok.cap ? '1' : '0';
  btn.dataset.zh = tok.zh;
  btn.dataset.recap = tok.recap;
  btn.dataset.state = 'idle';
  btn.textContent = '____';
  btn.addEventListener('click', () => {
    if (btn.dataset.state === 'done') return;
    if (btn.dataset.state === 'open') { closeChoice(btn); return; }
    openChoice(btn, exChoices, st);
  });
  st.answerables.push(btn);
  st.total++;
  return btn;
}

function closeChoice(btn) {
  btn.dataset.state = 'idle';
  btn.classList.remove('open');
  btn.textContent = '____';
}

function openChoice(btn, choices, st) {
  const ans = btn.dataset.answers.split('/')[0];
  const cap = btn.dataset.cap === '1';
  btn.dataset.state = 'open';
  btn.classList.add('open');
  btn.textContent = '';
  choices.forEach(c => {
    const b = document.createElement('button');
    b.className = 'choice'; b.type = 'button'; b.textContent = c;
    b.addEventListener('click', e => {
      e.stopPropagation();
      if (btn.dataset.state !== 'open') return;
      btn.dataset.state = 'done';
      btn.classList.remove('open');
      btn.textContent = '';
      if (c === ans) {
        const s = document.createElement('span'); s.className = 'fill correct'; s.textContent = display(c, cap);
        btn.appendChild(s); st.correct++;
      } else {
        const s = document.createElement('span'); s.className = 'fill wrong'; s.textContent = display(c, cap);
        btn.appendChild(s);
        const fb = document.createElement('span'); fb.className = 'fb';
        const hint = document.createElement('span'); hint.className = 'hint'; hint.textContent = '→ ' + display(ans, cap);
        fb.appendChild(hint);
        if (btn.dataset.zh) { const z = document.createElement('span'); z.className = 'hint-zh'; z.textContent = btn.dataset.zh; fb.appendChild(z); }
        btn.appendChild(fb);
        if (btn.dataset.recap) { const r = document.createElement('span'); r.innerHTML = recapBlock(btn.dataset.recap); btn.appendChild(r); attachRecap(btn); }
      }
      st.answered++;
      updateScore(st);
    });
    btn.appendChild(b);
  });
}

/* ---------- type-in blank ---------- */
function renderInputBlank(tok, st) {
  const wrap = document.createElement('span');
  wrap.className = 'iw';
  const inp = document.createElement('input');
  inp.className = 'ans';
  inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false;
  inp.dataset.answers = tok.answers.join('/');
  inp.dataset.primary = tok.primary;
  inp.dataset.cap = tok.cap ? '1' : '0';
  inp.dataset.zh = tok.zh;
  inp.dataset.recap = tok.recap;
  inp.dataset.state = 'idle';
  inp.placeholder = '…';
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') submitInput(inp, st); });
  inp.addEventListener('blur', () => submitInput(inp, st));
  wrap.appendChild(inp);
  if (tok.base) {
    const h = document.createElement('span');
    h.className = 'base-hint';
    h.textContent = '(' + tok.base + ')';
    wrap.appendChild(h);
  }
  st.answerables.push(inp);
  st.total++;
  return wrap;
}

function submitInput(inp, st) {
  if (inp.dataset.state === 'done') return;
  const val = norm(inp.value);
  if (!val) return;
  const accepted = inp.dataset.answers.split('/').map(norm);
  const cap = inp.dataset.cap === '1';
  inp.dataset.state = 'done';
  inp.readOnly = true;
  const fb = document.createElement('span');
  fb.className = 'fb';
  if (accepted.includes(val)) {
    inp.classList.add('correct');
    const b = document.createElement('span'); b.className = 'badge ok'; b.textContent = '✓';
    fb.appendChild(b);
    st.correct++;
  } else {
    inp.classList.add('wrong');
    const b = document.createElement('span'); b.className = 'badge no'; b.textContent = '✗';
    fb.appendChild(b);
    const hint = document.createElement('span'); hint.className = 'hint';
    hint.textContent = '→ ' + display(inp.dataset.primary, cap) + (inp.dataset.answers.includes('/') ? '（或 ' + inp.dataset.answers.split('/').slice(1).join(' / ') + '）' : '');
    fb.appendChild(hint);
    if (inp.dataset.zh) { const z = document.createElement('span'); z.className = 'hint-zh'; z.textContent = inp.dataset.zh; fb.appendChild(z); }
    if (inp.dataset.recap) { const r = document.createElement('span'); r.innerHTML = recapBlock(inp.dataset.recap); fb.appendChild(r); attachRecap(fb); }
  }
  inp.parentElement.appendChild(fb);
  st.answered++;
  updateScore(st);
}

/* ---------- MC ---------- */
function renderMc(item, st) {
  const box = document.createElement('div');
  box.className = 'mc-item';
  box.style.marginBottom = '16px';
  const q = document.createElement('div'); q.className = 'mc-q'; q.textContent = item.q;
  box.appendChild(q);
  const opts = document.createElement('div'); opts.className = 'mc-opts';
  opts.dataset.ans = item.ans;
  const letters = ['A', 'B', 'C', 'D'];
  item.opts.forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'mcopt'; b.type = 'button';
    b.textContent = letters[i] + '.  ' + o;
    b.addEventListener('click', () => {
      if (b.disabled) return;
      opts.querySelectorAll('button').forEach(x => x.disabled = true);
      if (i === item.ans) { b.classList.add('correct'); st.correct++; }
      else {
        b.classList.add('wrong');
        opts.querySelectorAll('button')[item.ans].classList.add('correct');
      }
      const fb = document.createElement('div'); fb.className = 'fb'; fb.style.marginTop = '6px';
      if (i === item.ans) { const s = document.createElement('span'); s.className = 'badge ok'; s.textContent = '✓ 答對'; fb.appendChild(s); }
      else {
        const s = document.createElement('span'); s.className = 'badge no'; s.textContent = '✗ 答錯'; fb.appendChild(s);
        const hint = document.createElement('span'); hint.className = 'hint'; hint.textContent = '答案：' + letters[item.ans]; fb.appendChild(hint);
        if (item.zh) { const z = document.createElement('span'); z.className = 'hint-zh'; z.textContent = item.zh; fb.appendChild(z); }
        if (item.recap) { const r = document.createElement('span'); r.innerHTML = recapBlock(item.recap); fb.appendChild(r); attachRecap(fb); }
      }
      box.appendChild(fb);
      st.answered++;
      updateScore(st);
    });
    opts.appendChild(b);
  });
  box.appendChild(opts);
  st.total++;
  return box;
}

/* ---------- 渲染整個 subject ---------- */
const LIVE = {};
function renderSubject(subject) {
  const st = makeSubjectState(subject);
  LIVE[subject.key] = st;
  const wrap = document.createElement('div');
  wrap.className = 'subject';
  wrap.id = 'subject-' + subject.key;

  const head = document.createElement('div');
  head.className = 'subject-head';
  head.innerHTML =
    '<h1>' + subject.label + '</h1>' +
    '<div class="sub">' + subject.sub + '　·　點擊空格選擇或打字作答，答錯會顯示正確答案＋中文解釋＋知識點 recap。</div>' +
    '<div class="scorebar"><span>Correct 答對: <b id="score-' + subject.key + '">0</b></span>' +
    '<span>Answered 已答: <span id="answered-' + subject.key + '">0</span></span>' +
    '<span>Total 總題: <span id="total-' + subject.key + '">0</span></span></div>' +
    '<div class="actions">' +
    '<button class="action" data-reveal>Reveal all 顯示答案</button>' +
    '<button class="action" data-reset>Reset 重做</button>' +
    '</div>';
  wrap.appendChild(head);

  const jump = document.createElement('div');
  jump.className = 'jump';
  subject.exercises.forEach((ex, i) => {
    const a = document.createElement('a');
    a.href = '#ex-' + subject.key + '-' + i;
    a.textContent = ex.title;
    jump.appendChild(a);
  });
  wrap.appendChild(jump);

  subject.exercises.forEach((ex, i) => {
    const sec = document.createElement('section');
    sec.className = 'ex';
    sec.id = 'ex-' + subject.key + '-' + i;
    const h2 = document.createElement('h2');
    h2.textContent = ex.title;
    if (ex.tag) { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = ex.tag; h2.appendChild(tag); }
    sec.appendChild(h2);
    if (ex.instr) { const p = document.createElement('div'); p.className = 'instr'; p.textContent = ex.instr; sec.appendChild(p); }

    if (ex.type === 'mc') {
      ex.items.forEach(item => sec.appendChild(renderMc(item, st)));
    } else {
      const ol = document.createElement('ol');
      ex.items.forEach(s => {
        const li = document.createElement('li');
        parseMarkup(s).forEach(tok => {
          if (tok.t) { li.appendChild(document.createTextNode(tok.t)); return; }
          if (ex.type === 'choice') li.appendChild(renderChoiceBlank(tok, ex.choices, st));
          else li.appendChild(renderInputBlank(tok, st));
        });
        ol.appendChild(li);
      });
      sec.appendChild(ol);
      if (ex.type === 'input') {
        const row = document.createElement('div'); row.className = 'check-row';
        const btn = document.createElement('button'); btn.className = 'action'; btn.type = 'button';
        btn.textContent = 'Check 檢查本練習';
        btn.addEventListener('click', () => {
          st.answerables.forEach(a => { if (a.tagName === 'INPUT' && a.dataset.state === 'idle') submitInput(a, st); });
        });
        row.appendChild(btn);
        sec.appendChild(row);
      }
    }
    wrap.appendChild(sec);
  });

  const dl = document.createElement('div');
  dl.className = 'download-bar';
  const pdfFile = subject.key === 'prepositions' ? 'pdfs/prepositions.pdf' : 'pdfs/tenses.pdf';
  dl.innerHTML = '<a class="action" href="' + pdfFile + '" download>⬇ 下載 PDF 版（練習＋答案）</a>' +
                 '<span class="dl-note">黑白可列印 worksheet，末頁附答案。</span>';
  wrap.appendChild(dl);

  // reveal / reset
  head.querySelector('[data-reveal]').addEventListener('click', () => {
    st.answerables.forEach(a => {
      if (a.dataset.state === 'done') return;
      a.dataset.state = 'done';
      if (a.tagName === 'INPUT') {
        a.value = display(a.dataset.primary, a.dataset.cap === '1');
        a.readOnly = true; a.classList.add('revealed');
      } else if (a.classList.contains('bk')) {
        a.classList.remove('open');
        a.textContent = '';
        const s = document.createElement('span'); s.className = 'fill correct'; s.textContent = display(a.dataset.primary, a.dataset.cap === '1');
        a.appendChild(s);
      }
    });
    // reveal MC correct options too
    wrap.querySelectorAll('.mc-opts').forEach(opts => {
      if (opts.querySelector('button:disabled')) return;
      const btns = opts.querySelectorAll('button');
      btns.forEach(b => b.disabled = true);
      btns[Number(opts.dataset.ans)].classList.add('correct');
    });
  });
  head.querySelector('[data-reset]').addEventListener('click', () => {
    const parent = wrap.parentElement;
    const fresh = renderSubject(subject);
    parent.replaceChild(fresh, wrap);
    fresh.classList.add('active');
    updateScore(fresh._st);
  });

  wrap._st = st;
  updateScore(st);
  return wrap;
}

/* ===================== 詞彙 & 聆聽 ===================== */
function speak(text, rate) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  if (rate) u.rate = rate;
  const voices = window.speechSynthesis.getVoices();
  const en = voices.find(v => v.lang && v.lang.slice(0, 2) === 'en' && /Samantha|Daniel|Karen|Serena|Google|Microsoft|Aria|Jenny/i.test(v.name)) ||
             voices.find(v => v.lang && v.lang.slice(0, 2) === 'en');
  if (en) u.voice = en;
  window.speechSynthesis.speak(u);
}

function numberToWords(n) {
  const ones = ['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const tens = ['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  if (n < 20) return ones[n];
  const t = Math.floor(n / 10), o = n % 10;
  return o ? tens[t] + '-' + ones[o] : tens[t];
}

function renderVocab() {
  const st = makeSubjectState({ key: 'vocab', label: '詞彙' });
  LIVE['vocab'] = st;
  const wrap = document.createElement('div');
  wrap.className = 'subject'; wrap.id = 'subject-vocab';

  const head = document.createElement('div');
  head.className = 'subject-head';
  head.innerHTML = '<h1>詞彙 Vocabulary</h1>' +
    '<div class="sub">高頻核心 300 字 ＋ 考試指令詞 ＋ 8 大主題。每字按 🔊 聽發音；每組可開「測驗」默寫。</div>';
  wrap.appendChild(head);

  VOCAB.forEach((set, si) => {
    const sec = document.createElement('section');
    sec.className = 'ex'; sec.id = 'vocab-' + si;
    const h2 = document.createElement('h2');
    h2.textContent = set.title;
    const tag = document.createElement('span');
    tag.className = 'tag'; tag.textContent = set.words.length + ' 字';
    h2.appendChild(tag);
    sec.appendChild(h2);

    const list = document.createElement('div');
    set.words.forEach(w => {
      const p = w.split('|');
      const [en, zh, pos, ex, exc] = p;
      const row = document.createElement('div'); row.className = 'wrow';
      const sp = document.createElement('button'); sp.className = 'speak-btn'; sp.type = 'button'; sp.textContent = '🔊'; sp.title = '聽發音';
      sp.addEventListener('click', () => speak(en));
      const wEl = document.createElement('span'); wEl.className = 'w'; wEl.textContent = en;
      const posEl = document.createElement('span'); posEl.className = 'pos'; posEl.textContent = pos;
      const cEl = document.createElement('span'); cEl.className = 'c'; cEl.textContent = zh;
      const exEl = document.createElement('span'); exEl.className = 'ex'; exEl.textContent = ex + '　' + exc;
      row.appendChild(sp); row.appendChild(wEl); row.appendChild(posEl); row.appendChild(cEl); row.appendChild(exEl);
      list.appendChild(row);
    });
    sec.appendChild(list);

    const quizArea = document.createElement('div'); quizArea.className = 'quiz';
    const quizBtn = document.createElement('button');
    quizBtn.className = 'action'; quizBtn.type = 'button'; quizBtn.textContent = '測驗這組（默寫）';
    quizBtn.addEventListener('click', () => {
      if (quizBtn.dataset.on === '1') { quizArea.innerHTML = ''; quizBtn.dataset.on = '0'; quizBtn.textContent = '測驗這組（默寫）'; return; }
      quizBtn.dataset.on = '1'; quizBtn.textContent = '收起測驗';
      quizArea.innerHTML = '';
      set.words.forEach(w => {
        const p = w.split('|'); const en = p[0], zh = p[1];
        const q = document.createElement('div'); q.className = 'quiz-q';
        const z = document.createElement('span'); z.className = 'zh'; z.textContent = zh;
        const sp = document.createElement('button'); sp.className = 'speak-btn'; sp.type = 'button'; sp.textContent = '🔊';
        sp.addEventListener('click', () => speak(en));
        const inp = document.createElement('input'); inp.type = 'text'; inp.autocomplete = 'off'; inp.spellcheck = false; inp.placeholder = '英文單字';
        const fb = document.createElement('span');
        const check = () => {
          if (inp.dataset.done === '1') return;
          const v = norm(inp.value); if (!v) return;
          inp.dataset.done = '1';
          if (norm(en) === v) { inp.classList.add('correct'); fb.innerHTML = '<span class="badge ok">✓</span>'; }
          else { inp.classList.add('wrong'); fb.innerHTML = '<span class="badge no">✗</span> <span class="hint">→ ' + en + '</span>'; }
        };
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
        inp.addEventListener('blur', check);
        q.appendChild(z); q.appendChild(sp); q.appendChild(inp); q.appendChild(fb);
        quizArea.appendChild(q);
      });
    });
    sec.appendChild(quizBtn);
    sec.appendChild(quizArea);
    wrap.appendChild(sec);
  });

  const dl = document.createElement('div'); dl.className = 'download-bar';
  dl.innerHTML = '<a class="action" href="pdfs/vocabulary.pdf" download>⬇ 下載詞彙 PDF</a>' +
                 '<a class="action" href="pdfs/plan.pdf" download>⬇ 下載 30 日計劃 PDF</a>' +
                 '<span class="dl-note">黑白可列印（詞彙表＋默寫練習）／30 日自學計劃。</span>';
  wrap.appendChild(dl);
  return wrap;
}

function renderListening() {
  const st = makeSubjectState({ key: 'listening', label: '聆聽' });
  LIVE['listening'] = st;
  const wrap = document.createElement('div');
  wrap.className = 'subject'; wrap.id = 'subject-listening';

  const head = document.createElement('div');
  head.className = 'subject-head';
  head.innerHTML = '<h1>聆聽 Listening</h1>' +
    '<div class="sub">真人錄音（ELLLO A1）＋ 數字／拼字基本功。點「▶ 播放真人音檔」在新視窗聽，再回來作答。</div>' +
    '<div class="scorebar"><span>Correct 答對: <b id="score-listening">0</b></span><span>Answered 已答: <span id="answered-listening">0</span></span><span>Total 總題: <span id="total-listening">0</span></span></div>' +
    '<div class="actions"><button class="action" data-reset>Reset 重做</button></div>';
  wrap.appendChild(head);

  LISTENING.forEach((u) => {
    const sec = document.createElement('section'); sec.className = 'ex';
    const h2 = document.createElement('h2');
    h2.textContent = u.title;
    const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = u.topic;
    h2.appendChild(tag);
    sec.appendChild(h2);

    const links = document.createElement('div');
    links.style.margin = '4px 0 10px';
    links.innerHTML = '<a class="action" href="' + u.audio + '" target="_blank" rel="noopener">▶ 播放真人音檔</a> ' +
                      '<a class="action" href="' + u.page + '" target="_blank" rel="noopener">看原文稿（ELLLO）</a>';
    sec.appendChild(links);

    const pl = document.createElement('div'); pl.className = 'lu-q';
    pl.innerHTML = '<span class="lbl">① 聽前預測</span>';
    sec.appendChild(pl);
    sec.appendChild(renderMc({ q: u.predict.q, opts: u.predict.opts, ans: u.predict.ans, zh: u.predict.zh, recap: null }, st));

    const kw = document.createElement('div'); kw.className = 'lu-q';
    kw.innerHTML = '<span class="lbl">② 關鍵字抓取</span>';
    sec.appendChild(kw);
    u.keywords.forEach((k, ki) => {
      const row = document.createElement('div'); row.className = 'quiz-q';
      const z = document.createElement('span'); z.className = 'zh'; z.style.minWidth = '0'; z.style.flex = '1 1 230px'; z.style.fontWeight = '400';
      z.textContent = (ki + 1) + '. ' + k.q;
      const tok = { blank: true, answers: k.ans.map(norm), primary: k.ans[0], base: null, zh: k.zh, recap: null, cap: false };
      row.appendChild(z);
      row.appendChild(renderInputBlank(tok, st));
      sec.appendChild(row);
    });

    const cl = document.createElement('div'); cl.className = 'lu-q';
    cl.innerHTML = '<span class="lbl">③ 聽寫填空</span>';
    sec.appendChild(cl);
    const clozeDiv = document.createElement('div'); clozeDiv.style.fontSize = '16px';
    parseMarkup(u.cloze).forEach(tok => {
      if (tok.t) clozeDiv.appendChild(document.createTextNode(tok.t));
      else clozeDiv.appendChild(renderInputBlank(tok, st));
    });
    sec.appendChild(clozeDiv);
    wrap.appendChild(sec);
  });

  // 基本功 drills
  const dsec = document.createElement('section'); dsec.className = 'ex';
  dsec.innerHTML = '<h2>聽寫基本功<span class="tag">數字 · 拼字（電腦語音）</span></h2>' +
    '<div class="instr">這兩項用電腦語音（非真人）練習——數字與拼字是香港聆聽卷最常出的題型。按 🔊 聽，輸入答案後按 Enter。</div>';

  const numBox = document.createElement('div'); numBox.className = 'drill';
  numBox.innerHTML = '<b>數字 Numbers</b><div class="drill-row"><button class="action" type="button" data-num-play>🔊 聽數字</button>' +
    '<input type="text" placeholder="輸入數字，如 23" data-num-inp><span data-num-fb></span></div>';
  dsec.appendChild(numBox);
  let currentNum = null;
  numBox.querySelector('[data-num-play]').addEventListener('click', () => { currentNum = Math.floor(Math.random() * 99) + 1; speak(numberToWords(currentNum), 0.8); });
  numBox.querySelector('[data-num-inp]').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const v = e.target.value.trim(); const fb = numBox.querySelector('[data-num-fb]');
      if (v === String(currentNum)) fb.innerHTML = '<span class="badge ok">✓ 答對</span>';
      else fb.innerHTML = '<span class="badge no">✗ 答錯</span> <span class="hint">→ ' + currentNum + '</span>';
    }
  });

  const spBox = document.createElement('div'); spBox.className = 'drill';
  spBox.innerHTML = '<b>拼字 Spelling</b><div class="drill-row"><button class="action" type="button" data-sp-play>🔊 聽拼字</button>' +
    '<input type="text" placeholder="輸入拼出的單字" data-sp-inp><span data-sp-fb></span></div>';
  dsec.appendChild(spBox);
  let currentWord = null;
  spBox.querySelector('[data-sp-play]').addEventListener('click', () => { currentWord = SPELLING_WORDS[Math.floor(Math.random() * SPELLING_WORDS.length)]; speak(currentWord.toUpperCase().split('').join(' '), 0.8); });
  spBox.querySelector('[data-sp-inp]').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const v = norm(e.target.value); const fb = spBox.querySelector('[data-sp-fb]');
      if (v === norm(currentWord)) fb.innerHTML = '<span class="badge ok">✓ 答對</span>';
      else fb.innerHTML = '<span class="badge no">✗ 答錯</span> <span class="hint">→ ' + currentWord + '</span>';
    }
  });
  wrap.appendChild(dsec);

  const dl = document.createElement('div'); dl.className = 'download-bar';
  dl.innerHTML = '<a class="action" href="pdfs/listening.pdf" download>⬇ 下載聆聽練習 PDF</a>' +
                 '<a class="action" href="pdfs/plan.pdf" download>⬇ 下載 30 日計劃 PDF</a>';
  wrap.appendChild(dl);

  head.querySelector('[data-reset]').addEventListener('click', () => {
    const parent = wrap.parentElement;
    const fresh = renderListening();
    parent.replaceChild(fresh, wrap);
    fresh.classList.add('active');
  });

  return wrap;
}

function init() {
  const main = document.getElementById('main');
  SUBJECTS.forEach(subject => {
    const w = renderSubject(subject);
    main.appendChild(w);
  });
  main.appendChild(renderVocab());
  main.appendChild(renderListening());
  // tab switching
  const tabs = document.querySelectorAll('.sidebar button.tab');
  function activate(key) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.subject === key));
    document.querySelectorAll('.subject').forEach(s => s.classList.toggle('active', s.id === 'subject-' + key));
    updateScore(LIVE[key]);
  }
  tabs.forEach(t => t.addEventListener('click', () => activate(t.dataset.subject)));
  activate('prepositions');
}


init();
